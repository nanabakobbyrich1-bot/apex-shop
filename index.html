<!-- SLIDING BANNER START -->
<div class="slider-container">
  <div class="slider-track">
    <div class="slide active" style="background: linear-gradient(135deg, #000 0%, #333 100%);">
      <h2>Quality Electronics & Custom Printing 🔥</h2>
      <p>Fast Delivery • MoMo Pay • WhatsApp Order</p>
    </div>
    <div class="slide" style="background: linear-gradient(135deg, #b71c1c 0%, #ff5252 100%);">
      <h2>🔥 HOT SALE - Up to 40% OFF</h2>
      <p>All Mifi & Chargers Today Only!</p>
    </div>
    <div class="slide" style="background: linear-gradient(135deg, #0d47a1 0%, #42a5f5 100%);">
      <h2>✨ NEW PRODUCTS ARRIVED</h2>
      <p>Latest Canvas Art & Gadgets In Stock</p>
    </div>
    <div class="slide" style="background: linear-gradient(135deg, #1b5e20 0%, #66bb6a 100%);">
      <h2>🎉 PROMOTION - Free Delivery</h2>
      <p>Bubieshie & Kaneshie Orders Over GHS 200</p>
    </div>
  </div>
  <div class="dots">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</div>

<style>
.slider-container{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  margin:15px;
  height:130px;
}
.slider-track{position:relative;height:100%;}
.slide{
  position:absolute;
  inset:0;
  padding:20px;
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  opacity:0;
  transform:translateX(100%);
  transition:all 0.6s ease;
}
.slide.active{
  opacity:1;
  transform:translateX(0);
}
.slide h2{font-size:22px;font-weight:800;margin-bottom:6px;}
.slide p{font-size:14px;opacity:0.9;}
.dots{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  display:flex;gap:6px;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,255,255,0.5);
}
.dot.active{background:#ffcc00;width:20px;border-radius:10px;}
</style>

<script>
let current=0;
const slides=document.querySelectorAll('.slide');
const dots=document.querySelectorAll('.dot');
function showSlide(n){
  slides.forEach(s=>s.classList.remove('active'));
  dots.forEach(d=>d.classList.remove('active'));
  slides[n].classList.add('active');
  dots[n].classList.add('active');
}
setInterval(()=>{
  current=(current+1)%slides.length;
  showSlide(current);
},3000);
// tap dots to change
dots.forEach((d,i)=>d.addEventListener('click',()=>{current=i;showSlide(i);}));
</script>
<!-- SLIDING BANNER END -->
