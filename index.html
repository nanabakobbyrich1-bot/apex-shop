<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX SHOP</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f2}
.top{background:#111;color:#fff;padding:12px 15px}
.top1{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px}.logo span{color:#ffcc00}
.search{display:flex;margin-top:10px;background:#fff;border-radius:10px;overflow:hidden}
.search input{flex:1;padding:14px;border:none;outline:none}
.search button{background:#ffcc00;border:none;padding:0 20px;font-weight:900}
.banner{background:#2b2b2b;color:#fff;margin:12px;border-radius:18px;padding:18px}
.banner h2{margin:0;font-size:20px}.banner p{margin:6px 0 0;font-size:13px;color:#ccc}
.cats{display:flex;gap:8px;padding:0 12px;overflow:auto}
.cats span{background:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 10px 80px}
.card{background:#fff;border-radius:16px;overflow:hidden;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:180px;object-fit:cover;cursor:pointer}
.badge{position:absolute;top:8px;right:8px;background:#ff2a2a;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:900}
.info{padding:10px}.name{font-size:13px;font-weight:bold;height:36px;overflow:hidden}
.price{font-weight:900;font-size:16px}.old{color:#999;text-decoration:line-through;font-size:12px}
.btn{background:#111;color:#fff;width:100%;padding:10px;border:none;border-radius:10px;font-weight:bold;margin-top:6px}
/* IMAGE VIEWER */
.img-viewer{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:2000;align-items:center;justify-content:center;flex-direction:column}
.img-viewer img{max-width:95%;max-height:80%;border-radius:12px}
.img-viewer button{margin-top:15px;background:#fff;color:#111;border:none;padding:10px 25px;border-radius:20px;font-weight:900}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:1000}
.box{background:#fff;width:90%;max-width:380px;border-radius:16px;padding:20px}
.box input{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px}
.pay{background:#111;color:#fff;width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold}
</style>
</head>
<body>

<div class="top">
<div class="top1">
<img src="logo.png" style="height:42px;">
<div>📍 Bubieshie</div>
</div>
<div class="search">
<input id="searchInput" placeholder="Search phones, chargers..." onkeyup="doSearch()">
<button onclick="doSearch()">Search</button>
</div>
</div>

<div class="banner">
<h2>Quality Electronics &<br>Custom Printing 🔥</h2>
<p>Fast Delivery • MoMo Pay • WhatsApp Order</p>
</div>

<div class="cats">
<span onclick="filterCat('all')">📱 All</span>
<span onclick="filterCat('mifi')">🔌 Mifi</span>
<span onclick="filterCat('charger')">⚡ Chargers</span>
<span onclick="filterCat('art')">🎨 Art</span>
</div>

<div style="padding:12px;font-weight:900;display:flex;justify-content:space-between"><span>🔥 Hot Products</span><span style="color:red;font-size:13px">TAP IMAGE TO VIEW</span></div>

<div class="grid" id="grid"></div>

<!-- BIG IMAGE VIEWER -->
<div class="img-viewer" id="imgViewer" onclick="closeImg()">
<img id="bigImg" src="">
<button onclick="closeImg()">✕ Close</button>
<p style="color:#fff;margin-top:10px;font-size:13px">Tap anywhere to close</p>
</div>

<!-- ORDER MODAL -->
<div class="modal" id="modal">
<div class="box">
<h3 id="mTitle" style="margin:0"></h3>
<p id="mPrice" style="font-weight:900"></p>
<input id="custName" placeholder="Your Name *">
<input id="custLocation" placeholder="Location * e.g. Bubieshie">
<input id="custPhone" placeholder="Phone *">
<input id="qty" type="number" value="1" min="1">
<button class="pay" onclick="sendOrder()">Order via MoMo</button>
<button onclick="document.getElementById('modal').style.display='none'" style="width:100%;padding:10px;margin-top:8px;background:#eee;border:none;border-radius:10px">Cancel</button>
</div>
</div>

<script>
const products=[
{name:"Universal Mifi 150Mbps - Mobile WiFi", price:300, cat:"mifi", disc:"HOT", img:"IMG_2398.jpeg"},
{name:"Modern Canvas Art", price:250, cat:"art", disc:"NEW", img:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=400"},
{name:"3-Piece Wall Set", price:450, cat:"art", disc:"-20%", img:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=400"},
{name:"iPhone 20W Fast Charger", price:90, cat:"charger", disc:"-20%", img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=400"},
];

let filtered = products;
let sel=null;

function render(list){
document.getElementById('grid').innerHTML=list.map((p,i)=>`
<div class="card">
<div class="badge">${p.disc}</div>
<img src="${p.img}" onclick="openImg('${p.img}')">
<div class="info">
<div class="name">${p.name}</div>
<div class="price">GHS ${p.price}</div>
<button class="btn" onclick="openModal(${products.indexOf(p)})">Order via MoMo</button>
</div></div>`).join('');
}
render(products);

function openImg(src){
document.getElementById('bigImg').src=src;
document.getElementById('imgViewer').style.display='flex';
}
function closeImg(){
document.getElementById('imgViewer').style.display='none';
}
function openModal(i){
sel=products[i];
document.getElementById('mTitle').innerText=sel.name;
document.getElementById('mPrice').innerText='GHS '+sel.price;
document.getElementById('modal').style.display='flex';
}
function sendOrder(){
const n=document.getElementById('custName').value;
const l=document.getElementById('custLocation').value;
const ph=document.getElementById('custPhone').value;
const q=document.getElementById('qty').value;
if(!n||!l||!ph){alert('Fill Name, Location, Phone');return;}
const total=sel.price*q;
const msg=`NEW ORDER%0AProduct: ${sel.name}%0ATotal: GHS ${total}%0AName: ${n}%0ALocation: ${l}%0APhone: ${ph}`;
window.open(`https://wa.me/23355XXXXXXX?text=${msg}`,'_blank');
document.getElementById('modal').style.display='none';
}
function doSearch(){
const s=document.getElementById('searchInput').value.toLowerCase();
filtered = products.filter(p=>p.name.toLowerCase().includes(s));
render(filtered);
}
function filterCat(c){
if(c=='all') filtered=products;
else filtered=products.filter(p=>p.cat==c);
render(filtered);
}
</script>
</body>
</html>
