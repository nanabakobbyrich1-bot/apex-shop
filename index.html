<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX SHOP</title>
<style>
body{font-family:Arial;margin:0;background:#fff}
header{background:#fff;padding:12px 15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:18px;letter-spacing:1px}
.logo span{color:#ffcc00}
.momo-top{background:#111;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;border:1px solid #f0f0f0;border-radius:14px;overflow:hidden}
.card img{width:100%;height:190px;object-fit:cover}
.info{padding:10px}.name{font-weight:bold;font-size:13px;height:32px;overflow:hidden}
.price{color:#111;font-weight:900;font-size:15px}
.btn{width:100%;padding:10px;border:none;border-radius:10px;font-weight:bold;margin-top:6px;background:#ffcc00;color:#111}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:999}
.box{background:#fff;width:90%;max-width:380px;border-radius:16px;padding:20px}
.box input{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px}
.pay{background:#111;color:#fff;width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold}
</style>
</head>
<body>

<header>
<div class="logo">APEX <span>SHOP</span></div>
<div class="momo-top">MoMo: 055 XXX XXXX</div>
</header>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div class="box">
<h3 id="mTitle" style="margin:0"></h3>
<p id="mPrice" style="font-weight:900"></p>
<input id="custName" placeholder="Your Name *">
<input id="custLocation" placeholder="Location * e.g. Bubieshie">
<input id="custPhone" placeholder="Phone *">
<input id="qty" type="number" value="1" min="1">
<button class="pay" onclick="sendOrder()">Confirm Order via MoMo</button>
<button onclick="document.getElementById('modal').style.display='none'" style="width:100%;padding:10px;margin-top:8px;background:#f5f5f5;border:none;border-radius:10px">Cancel</button>
</div>
</div>

<script>
const products=[
{name:"Universal mifi 150Mbps- Mobile WiFi", price:300, img:"IMG_2398.jpeg"},
{name:"Modern Canvas Art", price:250, img:"https://images.unsplash.com/photo-1577083288073-40892c0860a4?w=400"},
{name:"3-Piece Wall Set", price:450, img:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=400"},
];

let sel=null;
function render(){
document.getElementById('grid').innerHTML=products.map((p,i)=>`
<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
<div class="info">
<div class="name">${p.name}</div>
<div class="price">GHS ${p.price}</div>
<button class="btn" onclick="openModal(${i})">Order via MoMo</button>
</div></div>`).join('');
}
render();
function openModal(i){
sel=products[i];
document.getElementById('mTitle').innerText=sel.name;
document.getElementById('mPrice').innerText='GHS '+sel.price;
document.getElementById('modal').style.display='flex';
}
function sendOrder(){
const n=document.getElementById('custName').value;
const l=document.getElementById('custLocation').value;
const ph=document.getElementById('custPhone').value;
const q=document.getElementById('qty').value;
if(!n||!l||!ph){alert('Fill Name, Location, Phone');return;}
const total=sel.price*q;
const msg=`NEW ORDER%0AProduct: ${sel.name}%0APrice: GHS ${sel.price}%0AQty: ${q}%0ATotal: GHS ${total}%0AName: ${n}%0ALocation: ${l}%0APhone: ${ph}`;
window.open(`https://wa.me/23355XXXXXXX?text=${msg}`,'_blank');
document.getElementById('modal').style.display='none';
}
</script>
</body>
</html>
