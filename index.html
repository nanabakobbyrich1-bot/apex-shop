<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX SHOP - Bubieshie | 100+ Products</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#111;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:100}
header h1{margin:0} #search{width:90%;max-width:500px;padding:12px;border-radius:25px;border:none;margin:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:160px;object-fit:cover}
.info{padding:10px}.name{font-size:14px;font-weight:bold;height:36px;overflow:hidden}
.price{color:#d90000;font-weight:bold;font-size:16px}
.btn{background:#111;color:#fff;border:none;width:100%;padding:10px;border-radius:8px;margin-top:6px;font-weight:bold}
.btn-momo{background:#ffcc00;color:#111}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
.modal-box{background:#fff;width:90%;max-width:400px;border-radius:15px;padding:20px}
.modal-box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.modal-box button{width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold;margin-top:8px}
.pay{background:#25D366;color:#fff}.close{background:#eee}
.momo-box{background:#fff3cd;padding:15px;border-radius:10px;margin:10px auto;max-width:1100px;text-align:center;font-weight:bold}
</style>
</head>
<body>

<header>
<h1>APEX SHOP - BUBIESHIE</h1>
<p>100+ Framed Arts & Home Decor</p>
<input id="search" placeholder="Search product... e.g. Toy Shop, Canvas" onkeyup="filterProducts()">
</header>

<div class="momo-box">
💛 MoMo Pay: <span style="color:#d90000">055 XXX XXXX - APEX SHOP</span> | Delivery: Accra GHS 30
</div>

<div class="grid" id="grid"></div>

<!-- ORDER MODAL -->
<div class="modal" id="modal">
<div class="modal-box">
<h3 id="mTitle">Order Product</h3>
<p id="mPrice" style="color:#d90000;font-weight:bold"></p>
<input id="custName" placeholder="Your Full Name *">
<input id="custLocation" placeholder="Your Location * e.g. Bubieshie, Dansoman">
<input id="custPhone" placeholder="Your Phone Number * e.g. 055...">
<input id="custQty" type="number" value="1" min="1" placeholder="Quantity">
<button class="pay" onclick="sendOrder()">Pay via MoMo & Send Order</button>
<button class="close" onclick="closeModal()">Cancel</button>
<p style="font-size:12px;text-align:center;margin-top:10px">After tapping, your order will go to WhatsApp and you will see MoMo number to pay</p>
</div>
</div>

<script>
// ===== EDIT YOUR 100 PRODUCTS HERE =====
// Copy this line and change name, price, image
// For your real photo, use "toy.jpg" if you uploaded it

const products = [
{name:"Framed Toy Shop Puzzle - Your Real Product", price:300, img:"toy.jpg"},
{name:"Modern Abstract Canvas Art", price:250, img:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=400"},
{name:"3-Piece Living Room Set", price:450, img:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=400"},
{name:"Black Frame Family Photo Art", price:200, img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400"},
{name:"Luxury Gold Frame Art", price:350, img:"https://images.unsplash.com/photo-1536924430911-92f9e3f9d4b5?w=400"},
{name:"Kids Cartoon Wall Art", price:180, img:"https://images.unsplash.com/photo-1513364776144-60967b0f800f?w=400"},

// DUPLICATE FROM HERE FOR 100 PRODUCTS
// Example: {name:"Your Product Name", price:300, img:"your-image.jpg"},
{name:"Floral Canvas 60x40", price:220, img:"https://images.unsplash.com/photo-1577083288073-40892c0860a4?w=400"},
{name:"City Night View Art", price:280, img:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=400"},
{name:"African Culture Art", price:320, img:"https://images.unsplash.com/photo-1549490349-8643362247b5?w=400"},
{name:"Beach View Decor", price:260, img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400"},
// Add up to 100... just copy the line above!
];

let selectedProduct = null;
const grid = document.getElementById('grid');

function render(list){
grid.innerHTML='';
list.forEach((p,i)=>{
grid.innerHTML+=`<div class="card">
<img src="${p.img}" onerror="this.src='https://via.placeholder.com/300?text=APEX+SHOP'">
<div class="info">
<div class="name">${p.name}</div>
<div class="price">GHS ${p.price}</div>
<button class="btn btn-momo" onclick="openModal(${i})">Order via MoMo</button>
</div></div>`;
});
}
render(products);

function filterProducts(){
const q=document.getElementById('search').value.toLowerCase();
render(products.filter(p=>p.name.toLowerCase().includes(q)));
}

function openModal(i){
selectedProduct=products[i];
document.getElementById('mTitle').innerText=selectedProduct.name;
document.getElementById('mPrice').innerText='GHS '+selectedProduct.price;
document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';}

function sendOrder(){
const name=document.getElementById('custName').value;
const loc=document.getElementById('custLocation').value;
const phone=document.getElementById('custPhone').value;
const qty=document.getElementById('custQty').value;
if(!name||!loc||!phone){alert('Please fill Name, Location and Phone');return;}
const total = selectedProduct.price * qty;
const msg = `Hello APEX SHOP!%0A%0A*NEW ORDER*%0AProduct: ${selectedProduct.name}%0APrice: GHS ${selectedProduct.price}%0AQty: ${qty}%0ATotal: GHS ${total}%0A%0A*Customer:*%0AName: ${name}%0ALocation: ${loc}%0APhone: ${phone}%0A%0APayment: MoMo to 055 XXX XXXX%0ADelivery: Accra`;
window.open(`https://wa.me/23355XXXXXXX?text=${msg}`,'_blank');
closeModal();
}
</script>
</body>
</html>
