<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX SHOP</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
header{background:#111;color:#fff;padding:20px;text-align:center;position:sticky;top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card img{width:100%;height:180px;object-fit:cover}
.info{padding:10px}.name{font-weight:bold;font-size:14px;height:36px;overflow:hidden}
.price{color:#d90000;font-weight:bold}
.btn{width:100%;padding:10px;border:none;border-radius:8px;font-weight:bold;margin-top:5px}
.momo{background:#ffcc00}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:999}
.box{background:#fff;width:90%;max-width:400px;border-radius:15px;padding:20px}
.box input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.pay{background:#25D366;color:#fff;width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<header><h1>APEX SHOP - BUBIESHIE</h1><p>📞 MoMo: 055 XXX XXXX</p></header>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div class="box">
<h3 id="mTitle"></h3>
<p id="mPrice" style="color:red;font-weight:bold"></p>
<input id="custName" placeholder="Your Name *">
<input id="custLocation" placeholder="Your Location * e.g. Bubieshie">
<input id="custPhone" placeholder="Phone *">
<input id="qty" type="number" value="1" min="1">
<button class="pay" onclick="sendOrder()">Order via MoMo</button>
<button onclick="document.getElementById('modal').style.display='none'" style="width:100%;padding:10px;margin-top:8px;background:#eee;border:none;border-radius:8px">Cancel</button>
</div>
</div>

<script>
const products=[
{name:"Framed Toy Shop Puzzle - The Toy Shoppe", price:300, img:"IMG_2398.jpeg"},
{name:"Modern Canvas Art", price:250, img:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=400"},
{name:"3-Piece Wall Set", price:450, img:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=400"},
// ADD MORE HERE: {name:"Product Name", price:200, img:"p2.jpg"},
];

let sel=null;
function render(){
document.getElementById('grid').innerHTML=products.map((p,i)=>`
<div class="card">
<img src="${p.img}">
<div class="info">
<div class="name">${p.name}</div>
<div class="price">GHS ${p.price}</div>
<button class="btn momo" onclick="openModal(${i})">Order via MoMo</button>
</div></div>`).join('');
}
render();

function openModal(i){
sel=products[i];
document.getElementById('mTitle').innerText=sel.name;
document.getElementById('mPrice').innerText='GHS '+sel.price;
document.getElementById('modal').style.display='flex';
}
function sendOrder(){
const n=document.getElementById('custName').value;
const l=document.getElementById('custLocation').value;
const ph=document.getElementById('custPhone').value;
const q=document.getElementById('qty').value;
if(!n||!l||!ph){alert('Fill Name, Location, Phone');return;}
const total=sel.price*q;
const msg=`NEW ORDER%0AProduct: ${sel.name}%0APrice: GHS ${sel.price}%0AQty: ${q}%0ATotal: GHS ${total}%0AName: ${n}%0ALocation: ${l}%0APhone: ${ph}%0APay MoMo: 055 XXX XXXX`;
window.open(`https://wa.me/23355XXXXXXX?text=${msg}`,'_blank');
document.getElementById('modal').style.display='none';
}
</script>
</body>
</html>
