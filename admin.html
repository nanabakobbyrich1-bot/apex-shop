<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Add New Product</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .admin-card { background: #1e1e1e; width: 100%; max-width: 440px; padding: 28px 24px; border-radius: 16px; border: 1px solid #2a2a2a; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  
  /* Brand Header Styling */
  .brand-header { text-align: center; margin-bottom: 24px; }
  
  /* Logo Container */
  .logo-wrapper {
    width: 100%;
    max-width: 320px;
    background: #ffffff;
    border-radius: 16px;
    padding: 10px;
    margin: 0 auto 20px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .brand-logo { 
    width: 100%; 
    height: auto; 
    display: block; 
    object-fit: contain;
  }
  
  /* Brand Header Text */
  .title-apex { 
    font-size: 32px; 
    font-weight: 900; 
    color: #FFD400; 
    letter-spacing: 2px; 
    text-transform: uppercase; 
    line-height: 1.1;
  }

  .title-tech { 
    font-size: 26px; 
    font-weight: 900; 
    color: #ffffff; 
    letter-spacing: 1px; 
    text-transform: uppercase; 
    margin-top: 4px;
    line-height: 1.1;
  }

  .brand-tagline { 
    font-size: 11px; 
    font-weight: 700; 
    color: #aaaaaa; 
    letter-spacing: 1.5px; 
    text-transform: uppercase; 
    margin-top: 8px; 
  }

  .location-tag {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 500;
    color: #ffffff;
    margin-top: 8px;
    margin-bottom: 20px;
  }

  .location-tag svg {
    width: 16px;
    height: 16px;
    fill: #ffffff;
  }
  
  .section-title { 
    color: #FFD400; 
    text-align: center; 
    font-size: 18px; 
    font-weight: 800; 
    border-top: 1px solid #2a2a2a; 
    padding-top: 16px; 
  }

  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 700; color: #cccccc; margin-bottom: 6px; }
  input, select { width: 100%; padding: 12px 14px; background: #2a2a2a; border: 1px solid #3d3d3d; border-radius: 10px; color: #ffffff; font-size: 14px; outline: none; }
  input:focus, select:focus { border-color: #FFD400; }
  .publish-btn { width: 100%; padding: 14px; background: #FFD400; color: #000000; border: none; border-radius: 10px; font-size: 15px; font-weight: 900; cursor: pointer; margin-top: 10px; transition: 0.2s; }
  .publish-btn:hover { background: #e6bf00; }
</style>
</head>
<body>

<div class="admin-card">
  <!-- Brand Header -->
  <div class="brand-header">
    <div class="logo-wrapper">
      <img src="https://i.ibb.co/m5yN4kVW/IMG-4476.jpg" alt="APEX Logo" class="brand-logo">
    </div>
    
    <div class="title-apex">APEX</div>
    <div class="title-tech">TECH & GADGETS</div>
    <div class="brand-tagline">YOUR ONLINE SHOPPING DESTINATION</div>
    
    <div class="location-tag">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      Bubieshie, Accra
    </div>

    <div class="section-title">Add New Product</div>
  </div>

  <form id="productForm">
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="pName" placeholder="e.g. 4G Pocket MiFi" required>
    </div>

    <div class="form-group">
      <label>Price (GHS)</label>
      <input type="number" id="pPrice" placeholder="e.g. 250" required>
    </div>

    <div class="form-group">
      <label>Old Price (GHS) (Optional)</label>
      <input type="number" id="pOldPrice" placeholder="e.g. 300">
    </div>

    <div class="form-group">
      <label>Category</label>
      <input type="text" id="pCategory" placeholder="e.g. WiFi & Routers" required>
    </div>

    <div class="form-group">
      <label>Image URL</label>
      <input type="url" id="pImg" placeholder="Paste image link here" required>
    </div>

    <button type="submit" class="publish-btn" id="submitBtn">Publish Product</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8lyzlTLTBSeikS3-IgG6FJA",
    authDomain: "apex-tech-gadgets.firebaseapp.com",
    projectId: "apex-tech-gadgets",
    storageBucket: "apex-tech-gadgets.appspot.com",
    messagingSenderId: "947500498392",
    appId: "1:947500498392:web:870cf6123985",
    measurementId: "G-EB9FXQL07K"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById('productForm');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = "Publishing...";

    const name = document.getElementById('pName').value.trim();
    const price = Number(document.getElementById('pPrice').value);
    const oldPriceVal = document.getElementById('pOldPrice').value.trim();
    const oldPrice = oldPriceVal ? Number(oldPriceVal) : 0;
    const category = document.getElementById('pCategory').value.trim();
    const image = document.getElementById('pImg').value.trim();

    try {
      await addDoc(collection(db, "products"), {
        title: name,
        price: price,
        oldPrice: oldPrice,
        category: category,
        image: image,
        createdAt: serverTimestamp()
      });

      alert("Product published successfully!");
      form.reset();
    } catch (error) {
      console.error("Error adding product: ", error);
      alert("Failed to publish product. Please try again.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Publish Product";
    }
  });
</script>

</body>
</html>
