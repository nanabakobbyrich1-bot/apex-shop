<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX TECH - Admin Dashboard</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; padding: 20px; }
    .card { background: #1e1e1e; padding: 24px; border-radius: 12px; max-width: 400px; margin: 20px auto; border: 1px solid #333; }
    h2 { margin-top: 0; color: #FFD400; text-align: center; }
    label { font-size: 14px; color: #aaa; margin-top: 10px; display: block; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #333; box-sizing: border-box; font-size: 16px; }
    input, select { background: #2b2b2b; color: #fff; }
    button { background: #FFD400; color: #000; font-weight: bold; margin-top: 20px; border: none; cursor: pointer; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

<div class="card">
  <h2>Add New Product</h2>
  
  <label>Product Name</label>
  <input type="text" id="title" placeholder="e.g. 4G Pocket MiFi" />

  <label>Price (GHS)</label>
  <input type="number" id="price" placeholder="e.g. 250" />

  <label>Category</label>
  <input type="text" id="cat" placeholder="e.g. WiFi & Routers" />

  <label>Image URL</label>
  <input type="text" id="img" placeholder="Paste image link here" />

  <button onclick="addProduct()">Publish Product</button>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8lyzlTLTBSeikS3-IgG6FJA",
    authDomain: "apex-tech-gadgets.firebaseapp.com",
    projectId: "apex-tech-gadgets",
    storageBucket: "apex-tech-gadgets.firebasestorage.app",
    messagingSenderId: "947500498392",
    appId: "1:947500498392:web:870cf612398544e314fbbf",
    measurementId: "G-EB9FXQL07K"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.addProduct = async function() {
    let name = document.getElementById('title').value;
    let price = document.getElementById('price').value;
    let cat = document.getElementById('cat').value;
    let img = document.getElementById('img').value;

    if (!name || !price) {
      alert('Please enter at least a title and price.');
      return;
    }

    try {
      await addDoc(collection(db, "products"), {
        name: name,
        price: Number(price),
        cat: cat,
        img: img,
        createdAt: new Date()
      });
      alert("Product published live!");
      document.getElementById('title').value = '';
      document.getElementById('price').value = '';
      document.getElementById('cat').value = '';
      document.getElementById('img').value = '';
    } catch (e) {
      alert("Error adding product: " + e.message);
    }
  };
</script>

</body>
</html>
