<!-- ADD NEW PRODUCT SECTION (PLACED FIRST) -->
<div class="admin-card">
  <h2 class="admin-title">Add New Product</h2>
  
  <div class="form-group">
    <label>Product Name</label>
    <input type="text" id="pName" placeholder="e.g. Universal 4G Pocket MiFi">
  </div>

  <div class="form-group">
    <label>Category</label>
    <select id="pCat">
      <option value="Wifi & Routers">Wifi & Routers</option>
      <option value="Phones">Phones</option>
      <option value="Power Banks">Power Banks</option>
      <option value="Chargers">Chargers</option>
      <option value="Cables">Cables</option>
      <option value="Earbuds">Earbuds</option>
      <option value="Smart Watches">Smart Watches</option>
    </select>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Price (GH₵)</label>
      <input type="number" id="pPrice" placeholder="199">
    </div>
    <div class="form-group">
      <label>Old Price (GH₵)</label>
      <input type="number" id="pOldPrice" placeholder="220">
    </div>
  </div>

  <div class="form-group">
    <label>Product Image</label>
    <input type="file" id="pImgFile" accept="image/*">
  </div>

  <button class="btn-primary" onclick="addProduct()">Upload Product</button>
</div>

<!-- MANAGE PROMO BANNERS SECTION (PLACED BELOW PRODUCT) -->
<div class="admin-card">
  <h2 class="admin-title">Manage Promo Banners</h2>
  
  <div class="form-group">
    <label>Banner Title / Promo Tag (Optional)</label>
    <input type="text" id="bTitle" placeholder="e.g. Mega Weekend Sales 20% OFF">
  </div>

  <div class="form-group">
    <label>Select Banner Image from Phone</label>
    <input type="file" id="bImgFile" accept="image/*">
  </div>

  <button class="btn-primary" onclick="uploadBanner()">Upload Banner</button>
</div>

<!-- ACTIVE BANNERS DISPLAY -->
<div class="admin-card">
  <div class="card-header">
    <h2 class="admin-title">Active Banners</h2>
    <span class="badge-count" id="bannerCount">0 banners</span>
  </div>
  <div id="bannerList">
    <p class="empty-msg">No promo banners uploaded yet.</p>
  </div>
</div>
