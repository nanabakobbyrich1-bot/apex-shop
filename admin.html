<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - APEX Tech & Gadgets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
  .admin-card { background: #1e1e1e; width: 100%; max-width: 480px; padding: 28px 24px; border-radius: 16px; border: 1px solid #2a2a2a; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 30px; }
  
  .brand-header { text-align: center; margin-bottom: 24px; }
  
  .logo-wrapper {
    width: 160px;
    height: 100px;
    background: #ffffff;
    border-radius: 12px;
    padding: 8px;
    margin: 0 auto 16px auto;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .brand-logo { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .title-apex { font-size: 32px; font-weight: 900; color: #FFD400; letter-spacing: 2px; text-transform: uppercase; line-height: 1.1; }
  .title-tech { font-size: 26px; font-weight: 900; color: #ffffff; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; line-height: 1.1; }
  .brand-tagline { font-size: 11px; font-weight: 700; color: #aaaaaa; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 8px; }

  .location-tag {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 15px; font-weight: 500; color: #ffffff; margin-top: 8px; margin-bottom: 20px;
  }
  .location-tag svg { width: 16px; height: 16px; fill: #ffffff; }
  
  .section-title { color: #FFD400; text-align: center; font-size: 18px; font-weight: 800; border-top: 1px solid #2a2a2a; padding-top: 16px; }

  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 700; color: #cccccc; margin-bottom: 6px; }
  input, select { width: 100%; padding: 12px 14px; background: #2a2a2a; border: 1px solid #3d3d3d; border-radius: 10px; color: #ffffff; font-size: 14px; outline: none; }
  input[type="file"] { padding: 10px; cursor: pointer; }
  input:focus, select:focus { border-color: #FFD400; }
  
  .preview-box { width: 100%; height: 140px; background: #2a2a2a; border: 1px dashed #444; border-radius: 10px; display: none; justify-content: center; align-items: center; margin-top: 8px; overflow: hidden; }
  .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .checkbox-group { display: flex; gap: 15px; margin-top: 10px; margin-bottom: 16px; }
  .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #FFD400; cursor: pointer; }

  .button-group { display: flex; gap: 10px; margin-top: 10px; }
  .publish-btn { flex: 1; padding: 14px; background: #FFD400; color: #000000; border: none; border-radius: 10px; font-size: 15px; font-weight: 900; cursor: pointer; transition: 0.2s; }
  .publish-btn:hover { background: #e6bf00; }
  .cancel-btn { display: none; padding: 14px; background: #3d3d3d; color: #ffffff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .cancel-btn:hover { background: #4a4a4a; }

  .inventory-card { background: #1e1e1e; width: 100%; max-width: 480px; padding: 20px; border-radius: 16px; border: 1px solid #2a2a2a; }
  .inventory-title { color: #FFD400; font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .prod-row { display: flex; align-items: center; background: #2a2a2a; padding: 10px; border-radius: 10px; gap: 10px; }
  .prod-row img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #fff; flex-shrink: 0; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-title { font-size: 13px; font-weight: bold; color: #fff; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prod-meta { font-size: 11px; color: #aaa; margin-top: 3px; }
  .badge-tag { font-size: 9px; padding: 2px 5px; border-radius: 4px; background: #FFD400; color: #000; font-weight: 800; margin-left: 4px; display: inline-block; }
  
  .prod-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .edit-btn { background: #2563eb; color: #fff; border: none; padding: 8px 10px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; transition: 0.2s; }
  .edit-btn:hover { background: #1d4ed8; }
  .delete-btn { background: #ef4444; color: #fff; border: none; padding: 8px 10px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; transition: 0.2s; }
  .delete-btn:hover { background: #dc2626; }
</style>
</head>
<body>

<div class="admin-card">
  <div class="brand-header">
    <div class="logo-wrapper">
      <img src="https://i.ibb.co/zV26ZpTv/IMG-4476.jpg" alt="APEX Logo" class="brand-logo">
    </div>
    
    <div class="title-apex">APEX</div>
    <div class="title-tech">TECH & GADGETS</div>
    <div class="brand-tagline">YOUR ONLINE SHOPPING DESTINATION</div>
    
    <div class="location-tag">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5-2.5z"/>
      </svg>
      Bubieshie, Accra
    </div>

    <div class="section-title" id="formSectionTitle">Add New Product</div>
  </div>

  <form id="productForm">
    <!-- Hidden input to track current edit product ID -->
    <input type="hidden" id="editProductId" value="">

    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="pName" placeholder="e.g. Universal 4G Pocket MiFi" required>
    </div>

    <div class="form-group">
      <label>Price (GHS)</label>
      <input type="number" id="pPrice" placeholder="e.g. 250" required>
    </div>

    <div class="form-group">
      <label>Old Price (GHS) (Optional)</label>
      <input type="number" id="pOldPrice" placeholder="e.g. 300">
    </div>

    <div class="form-group">
      <label>Category</label>
      <select id="pCategory" required>
        <option value="Wifi & Routers">Wifi & Routers</option>
        <option value="Phones">Phones</option>
        <option value="Power Banks">Power Banks</option>
        <option value="Chargers">Chargers</option>
        <option value="Cables">Cables</option>
        <option value="Earbuds">Earbuds</option>
        <option value="Smart Watches">Smart Watches</option>
        <option value="Home Appliance">Home Appliance</option>
        <option value="Frame">Frame</option>
        <option value="Others">Others</option>
      </select>
    </div>

    <!-- Photo Library Selector -->
    <div class="form-group">
      <label>Select Photo from Phone Library</label>
      <input type="file" id="pImageFile" accept="image/*">
      <div id="previewBox" class="preview-box">
        <img id="imgPreview" src="" alt="Preview">
      </div>
    </div>

    <div class="checkbox-group">
      <label class="checkbox-item">
        <input type="checkbox" id="isFeatured">
        <span>Featured & Trending</span>
      </label>
      <label class="checkbox-item">
        <input type="checkbox" id="isBestSeller">
        <span>Best Seller</span>
      </label>
    </div>

    <div class="button-group">
      <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="publish-btn" id="submitBtn">Publish Product</button>
    </div>
  </form>
</div>

<div class="inventory-card">
  <div class="inventory-title">
    <span>Live Catalog</span>
    <span id="prodCount" style="font-size:12px; color:#aaa;">0 items</span>
  </div>
  <div id="itemList" class="item-list">
    <div style="color:#888; font-size:13px; text-align:center; padding:10px;">Loading catalog...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, serverTimestamp, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8lyzlTLTBSeikS3-IgG6FJA",
    authDomain: "apex-tech-gadgets.firebaseapp.com",
    projectId: "apex-tech-gadgets",
    storageBucket: "apex-tech-gadgets.appspot.com",
    messagingSenderId: "947500498392",
    appId: "1:947500498392:web:870cf6123985",
    measurementId: "G-EB9FXQL07K"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById('productForm');
  const editProductIdInput = document.getElementById('editProductId');
  const submitBtn = document.getElementById('submitBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const formSectionTitle = document.getElementById('formSectionTitle');
  const pImageFileInput = document.getElementById('pImageFile');
  const previewBox = document.getElementById('previewBox');
  const imgPreview = document.getElementById('imgPreview');
  const itemList = document.getElementById('itemList');
  const prodCount = document.getElementById('prodCount');

  const DEFAULT_IMAGE = "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&auto=format&fit=crop";
  let loadedProducts = {}; // Memory cache for rapid edit fetching

  // Photo Preview Logic
  pImageFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        imgPreview.src = event.target.result;
        previewBox.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    } else {
      if (!editProductIdInput.value || !imgPreview.src) {
        previewBox.style.display = 'none';
      }
    }
  });

  // Compress & Resize Image to lightweight Base64 string
  function processAndCompressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 600;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
      };
    });
  }

  // Reset Form to Add Mode
  function resetFormToAddMode() {
    form.reset();
    editProductIdInput.value = "";
    previewBox.style.display = 'none';
    imgPreview.src = "";
    formSectionTitle.innerText = "Add New Product";
    submitBtn.innerText = "Publish Product";
    cancelBtn.style.display = 'none';
  }

  cancelBtn.addEventListener('click', resetFormToAddMode);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const editId = editProductIdInput.value;
    const isEditing = Boolean(editId);

    submitBtn.disabled = true;
    submitBtn.innerText = isEditing ? "Updating Product..." : "Publishing Product...";

    const name = document.getElementById('pName').value.trim();
    const price = Number(document.getElementById('pPrice').value);
    const oldPriceVal = document.getElementById('pOldPrice').value.trim();
    const oldPrice = oldPriceVal ? Number(oldPriceVal) : 0;
    const category = document.getElementById('pCategory').value;
    const isFeatured = document.getElementById('isFeatured').checked;
    const isBestSeller = document.getElementById('isBestSeller').checked;

    let imageUrl = isEditing ? loadedProducts[editId]?.image || DEFAULT_IMAGE : DEFAULT_IMAGE;

    try {
      if (pImageFileInput.files.length > 0) {
        const selectedFile = pImageFileInput.files[0];
        imageUrl = await processAndCompressImage(selectedFile);
      }

      const productPayload = {
        title: name,
        price: price,
        oldPrice: oldPrice,
        category: category,
        image: imageUrl,
        isFeatured: isFeatured,
        isBestSeller: isBestSeller,
        rating: "4.8",
        reviews: 42
      };

      if (isEditing) {
        await updateDoc(doc(db, "products", editId), productPayload);
        alert("Product updated successfully!");
      } else {
        productPayload.createdAt = serverTimestamp();
        await addDoc(collection(db, "products"), productPayload);
        alert("Product published successfully!");
      }

      resetFormToAddMode();
    } catch (error) {
      console.error("Error saving product: ", error);
      alert("Failed to save product. Please try again.");
    } finally {
      submitBtn.disabled = false;
      if (editProductIdInput.value) {
        submitBtn.innerText = "Update Product";
      } else {
        submitBtn.innerText = "Publish Product";
      }
    }
  });

  // Listen for Realtime Changes in Firestore
  onSnapshot(collection(db, "products"), (snapshot) => {
    itemList.innerHTML = "";
    prodCount.innerText = `${snapshot.size} items`;
    loadedProducts = {};

    if (snapshot.empty) {
      itemList.innerHTML = `<div style="color:#888; font-size:13px; text-align:center; padding:10px;">No products added yet.</div>`;
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;
      loadedProducts[id] = data;

      const row = document.createElement('div');
      row.className = 'prod-row';
      row.innerHTML = `
        <img src="${data.image || DEFAULT_IMAGE}" alt="Thumb">
        <div class="prod-info">
          <div class="prod-title">${data.title || 'Untitled'}</div>
          <div class="prod-meta">
            GHS ${data.price || 0} • ${data.category || 'General'}
            ${data.isFeatured ? '<span class="badge-tag">Featured</span>' : ''}
            ${data.isBestSeller ? '<span class="badge-tag">Best Seller</span>' : ''}
          </div>
        </div>
        <div class="prod-actions">
          <button class="edit-btn" data-id="${id}">Edit</button>
          <button class="delete-btn" data-id="${id}">Delete</button>
        </div>
      `;

      itemList.appendChild(row);
    });

    // EDIT Event Listener
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const docId = e.target.getAttribute('data-id');
        const p = loadedProducts[docId];
        if (!p) return;

        // Populate Form Fields
        editProductIdInput.value = docId;
        document.getElementById('pName').value = p.title || '';
        document.getElementById('pPrice').value = p.price || '';
        document.getElementById('pOldPrice').value = p.oldPrice || '';
        document.getElementById('pCategory').value = p.category || 'Wifi & Routers';
        document.getElementById('isFeatured').checked = Boolean(p.isFeatured);
        document.getElementById('isBestSeller').checked = Boolean(p.isBestSeller);

        // Preview Existing Image
        if (p.image) {
          imgPreview.src = p.image;
          previewBox.style.display = 'flex';
        } else {
          previewBox.style.display = 'none';
        }

        // Update Form Display
        formSectionTitle.innerText = "Edit Product";
        submitBtn.innerText = "Update Product";
        cancelBtn.style.display = 'block';

        // Scroll gracefully to the form
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    // DELETE Event Listener
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const docId = e.target.getAttribute('data-id');
        const itemTitle = loadedProducts[docId]?.title || 'this product';
        if (confirm(`Are you sure you want to delete "${itemTitle}"?`)) {
          try {
            await deleteDoc(doc(db, "products", docId));
            if (editProductIdInput.value === docId) {
              resetFormToAddMode();
            }
          } catch (err) {
            console.error("Error deleting product:", err);
            alert("Could not delete product.");
          }
        }
      });
    });
  });
</script>

</body>
</html>
