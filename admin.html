<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - APEX Tech & Gadgets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
  .admin-card { background: #1e1e1e; width: 100%; max-width: 480px; padding: 28px 24px; border-radius: 16px; border: 1px solid #2a2a2a; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 30px; }
  
  .brand-header { text-align: center; margin-bottom: 24px; }
  
  .logo-wrapper {
    width: 160px;
    height: 100px;
    background: #ffffff;
    border-radius: 12px;
    padding: 8px;
    margin: 0 auto 16px auto;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .brand-logo { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .title-apex { font-size: 32px; font-weight: 900; color: #FFD400; letter-spacing: 2px; text-transform: uppercase; line-height: 1.1; }
  .title-tech { font-size: 26px; font-weight: 900; color: #ffffff; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; line-height: 1.1; }
  .brand-tagline { font-size: 11px; font-weight: 700; color: #aaaaaa; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 8px; }

  .location-tag {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 15px; font-weight: 500; color: #ffffff; margin-top: 8px; margin-bottom: 20px;
  }
  .location-tag svg { width: 16px; height: 16px; fill: #ffffff; }
  
  .section-title { color: #FFD400; text-align: center; font-size: 18px; font-weight: 800; border-top: 1px solid #2a2a2a; padding-top: 16px; }

  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 700; color: #cccccc; margin-bottom: 6px; }
  input, select { width: 100%; padding: 12px 14px; background: #2a2a2a; border: 1px solid #3d3d3d; border-radius: 10px; color: #ffffff; font-size: 14px; outline: none; }
  input[type="file"] { padding: 10px; cursor: pointer; }
  input:focus, select:focus { border-color: #FFD400; }
  
  .preview-box { width: 100%; height: 140px; background: #2a2a2a; border: 1px dashed #444; border-radius: 10px; display: none; justify-content: center; align-items: center; margin-top: 8px; overflow: hidden; }
  .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .checkbox-group { display: flex; gap: 15px; margin-top: 10px; margin-bottom: 16px; }
  .checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #FFD400; cursor: pointer; }

  .publish-btn { width: 100%; padding: 14px; background: #FFD400; color: #000000; border: none; border-radius: 10px; font-size: 15px; font-weight: 900; cursor: pointer; margin-top: 10px; transition: 0.2s; }
  .publish-btn:hover { background: #e6bf00; }

  .inventory-card { background: #1e1e1e; width: 100%; max-width: 480px; padding: 20px; border-radius: 16px; border: 1px solid #2a2a2a; }
  .inventory-title { color: #FFD400; font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .prod-row { display: flex; align-items: center; background: #2a2a2a; padding: 10px; border-radius: 10px; gap: 12px; }
  .prod-row img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: #fff; }
  .prod-info { flex: 1; }
  .prod-title { font-size: 13px; font-weight: bold; color: #fff; line-height: 1.2; }
  .prod-meta { font-size: 11px; color: #aaa; margin-top: 3px; }
  .badge-tag { font-size: 9px; padding: 2px 5px; border-radius: 4px; background: #FFD400; color: #000; font-weight: 800; margin-left: 4px; }
  .delete-btn { background: #ef4444; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; }
  .delete-btn:hover { background: #dc2626; }
</style>
</head>
<body>

<div class="admin-card">
  <div class="brand-header">
    <div class="logo-wrapper">
      <img src="https://i.ibb.co/zV26ZpTv/IMG-4476.jpg" alt="APEX Logo" class="brand-logo">
    </div>
    
    <div class="title-apex">APEX</div>
    <div class="title-tech">TECH & GADGETS</div>
    <div class="brand-tagline">YOUR ONLINE SHOPPING DESTINATION</div>
    
    <div class="location-tag">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5-2.5z"/>
      </svg>
      Bubieshie, Accra
    </div>

    <div class="section-title">Add New Product</div>
  </div>

  <form id="productForm">
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="pName" placeholder="e.g. Universal 4G Pocket MiFi" required>
    </div>

    <div class="form-group">
      <label>Price (GHS)</label>
      <input type="number" id="pPrice" placeholder="e.g. 250" required>
    </div>

    <div class="form-group">
      <label>Old Price (GHS) (Optional)</label>
      <input type="number" id="pOldPrice" placeholder="e.g. 300">
    </div>

    <div class="form-group">
      <label>Category</label>
      <select id="pCategory" required>
        <option value="Wifi & Routers">Wifi & Routers</option>
        <option value="Phones">Phones</option>
        <option value="Power Banks">Power Banks</option>
        <option value="Chargers">Chargers</option>
        <option value="Cables">Cables</option>
        <option value="Earbuds">Earbuds</option>
        <option value="Smart Watches">Smart Watches</option>
        <option value="Home Appliance">Home Appliance</option>
      </select>
    </div>

    <!-- Photo Library Selector -->
    <div class="form-group">
      <label>Select Photo from Phone Library</label>
      <input type="file" id="pImageFile" accept="image/*">
      <div id="previewBox" class="preview-box">
        <img id="imgPreview" src="" alt="Preview">
      </div>
    </div>

    <div class="checkbox-group">
      <label class="checkbox-item">
        <input type="checkbox" id="isFeatured">
        <span>Featured & Trending</span>
      </label>
      <label class="checkbox-item">
        <input type="checkbox" id="isBestSeller">
        <span>Best Seller</span>
      </label>
    </div>

    <button type="submit" class="publish-btn" id="submitBtn">Publish Product</button>
  </form>
</div>

<div class="inventory-card">
  <div class="inventory-title">
    <span>Live Catalog</span>
    <span id="prodCount" style="font-size:12px; color:#aaa;">0 items</span>
  </div>
  <div id="itemList" class="item-list">
    <div style="color:#888; font-size:13px; text-align:center; padding:10px;">Loading catalog...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC8lyzlTLTBSeikS3-IgG6FJA",
    authDomain: "apex-tech-gadgets.firebaseapp.com",
    projectId: "apex-tech-gadgets",
    storageBucket: "apex-tech-gadgets.appspot.com",
    messagingSenderId: "947500498392",
    appId: "1:947500498392:web:870cf6123985",
    measurementId: "G-EB9FXQL07K"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById('productForm');
  const submitBtn = document.getElementById('submitBtn');
  const pImageFileInput = document.getElementById('pImageFile');
  const previewBox = document.getElementById('previewBox');
  const imgPreview = document.getElementById('imgPreview');
  const itemList = document.getElementById('itemList');
  const prodCount = document.getElementById('prodCount');

  const DEFAULT_IMAGE = "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&auto=format&fit=crop";

  // Photo Preview Logic when selecting from Photo Library
  pImageFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        imgPreview.src = event.target.result;
        previewBox.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    } else {
      previewBox.style.display = 'none';
    }
  });

  // Convert image to web-optimized URL via ImgBB upload API
  async function uploadToImgBB(file) {
    const apiKey = "d1df7b1fa15c32d4be0c2793132fa2d2"; // Free ImgBB API key for seamless photo uploads
    const formData = new FormData();
    formData.append("image", file);

    const res = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    if (data.success) {
      return data.data.url;
    } else {
      throw new Error("Image upload failed");
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = "Uploading Image...";

    const name = document.getElementById('pName').value.trim();
    const price = Number(document.getElementById('pPrice').value);
    const oldPriceVal = document.getElementById('pOldPrice').value.trim();
    const oldPrice = oldPriceVal ? Number(oldPriceVal) : 0;
    const category = document.getElementById('pCategory').value;
    const isFeatured = document.getElementById('isFeatured').checked;
    const isBestSeller = document.getElementById('isBestSeller').checked;

    let imageUrl = DEFAULT_IMAGE;

    try {
      if (pImageFileInput.files.length > 0) {
        const selectedFile = pImageFileInput.files[0];
        imageUrl = await uploadToImgBB(selectedFile);
      }

      submitBtn.innerText = "Publishing Product...";

      await addDoc(collection(db, "products"), {
        title: name,
        price: price,
        oldPrice: oldPrice,
        category: category,
        image: imageUrl,
        isFeatured: isFeatured,
        isBestSeller: isBestSeller,
        rating: "4.8",
        reviews: 42,
        createdAt: serverTimestamp()
      });

      alert("Product published successfully!");
      form.reset();
      previewBox.style.display = 'none';
    } catch (error) {
      console.error("Error adding product: ", error);
      alert("Failed to publish product. Please check connection and try again.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Publish Product";
    }
  });

  onSnapshot(collection(db, "products"), (snapshot) => {
    itemList.innerHTML = "";
    prodCount.innerText = `${snapshot.size} items`;

    if (snapshot.empty) {
      itemList.innerHTML = `<div style="color:#888; font-size:13px; text-align:center; padding:10px;">No products added yet.</div>`;
      return;
    }

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const id = docSnap.id;

      const row = document.createElement('div');
      row.className = 'prod-row';
      row.innerHTML = `
        <img src="${data.image || DEFAULT_IMAGE}" alt="Thumb">
        <div class="prod-info">
          <div class="prod-title">${data.title || 'Untitled'}</div>
          <div class="prod-meta">
            GHS ${data.price || 0} • ${data.category || 'General'}
            ${data.isFeatured ? '<span class="badge-tag">Featured</span>' : ''}
            ${data.isBestSeller ? '<span class="badge-tag">Best Seller</span>' : ''}
          </div>
        </div>
        <button class="delete-btn" data-id="${id}">Delete</button>
      `;

      itemList.appendChild(row);
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const docId = e.target.getAttribute('data-id');
        if (confirm("Are you sure you want to delete this product?")) {
          try {
            await deleteDoc(doc(db, "products", docId));
          } catch (err) {
            console.error("Error deleting product:", err);
            alert("Could not delete product.");
          }
        }
      });
    });
  });
</script>

</body>
</html>
